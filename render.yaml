# Render Blueprint — backend API only (frontend on Vercel)
# Dashboard: New → Blueprint → connect repo, or create Web Service manually.

services:
  - type: web
    name: gem-ai-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLIENT_URL
        sync: false
